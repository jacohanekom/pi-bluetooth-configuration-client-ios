# XcodeGen spec -- run `xcodegen generate` (or `make generate`) to produce
# Aipicam.xcodeproj from this file.
#
# This repo checks in project.yml, not the .xcodeproj itself, for the same
# reason pi-bluetooth-configuration-client-mac's .gitignore excludes
# *.xcodeproj: a generated project file is a build artifact, not source,
# and raw .pbxproj diffs are unreviewable noise. Unlike that Mac client,
# though, a plain `swift build` can't produce an installable, signed iOS
# .app -- there's no SPM product type for that, and no equivalent of the
# Mac build's "bare executable + Info.plist in __info_plist" trick, since
# iOS enforces real app-bundle + code-signing rules that macOS doesn't for
# a Bluetooth-only, non-sandboxed CLI binary. XcodeGen is the smallest
# tool that bridges that gap: a readable, diffable YAML spec in, a normal
# Xcode project out, checked in nowhere.
name: Aipicam
options:
  bundleIdPrefix: com.jacohanekom
  deploymentTarget:
    iOS: "16.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Aipicam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Aipicam
        excludes:
          - Info.plist
    # XcodeGen owns and rewrites whatever file "info.path" points to on
    # every `xcodegen generate` -- it does NOT merge with hand-edited
    # content there (learned the hard way: an earlier version of this
    # file pointed at a manually-written Info.plist, and generating
    # silently clobbered it, a usage-description key included -- which
    # would have made the app crash on first access to the gated API with
    # no indication why). So the actual plist content lives here, in
    # "properties", not in a separately maintained file.
    info:
      path: Sources/Aipicam/Info.plist
      properties:
        CFBundleDisplayName: aipicam
        CFBundleName: aipicam
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # This app talks plain HTTP to a Pi on the local network (see
        # HTTPManager.swift) -- iOS gates outgoing connections to private/
        # local IP ranges behind a runtime permission prompt on iOS 14+,
        # and requires this description string to be present at all
        # before it'll even show that prompt rather than just failing the
        # connection silently.
        NSLocalNetworkUsageDescription: >-
          Used to configure an aipicam device's WiFi and view its status over your local network.
        # Answers App Store Connect's export-compliance question ("What
        # type of encryption algorithms does your app implement?") at
        # build time instead of it being asked -- and blocking TestFlight
        # availability -- on every single upload. False is accurate: this
        # app's HTTP traffic to the Pi is deliberately unencrypted (see
        # the daemon's README, "Security model"), and the app makes no
        # HTTPS/TLS calls of its own.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: aipicam
        PRODUCT_BUNDLE_IDENTIFIER: com.jacohanekom.aipicam
        # Swift 5 language mode, not 6 -- matches
        # pi-bluetooth-configuration-client-mac's Package.swift
        # (.swiftLanguageMode(.v5)). No longer forced by CoreBluetooth's
        # non-Sendable CBUUID (that dependency is gone -- see
        # HTTPManager.swift), just left as-is to avoid taking on Swift 6's
        # stricter concurrency checking as part of an unrelated change.
        SWIFT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
