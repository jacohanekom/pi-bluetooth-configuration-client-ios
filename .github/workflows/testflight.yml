name: TestFlight

# Only on version tags (or manually) -- unlike build.yml's unsigned
# compile-check/artifact, this uploads a real build to App Store Connect
# on every run, so it shouldn't fire on every push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # xcodebuild's -authenticationKeyPath takes an explicit path, but
      # `xcrun altool` (used for the actual upload below) has no such
      # flag -- it only auto-discovers a key by scanning a fixed set of
      # directories for a file named exactly "AuthKey_<key ID>.p8".
      # ~/private_keys is one of those documented search paths, so this
      # one file location works for both tools.
      - name: Install App Store Connect API key
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # The version shown in TestFlight/App Store Connect comes from the
      # git tag (v1.2.3 -> MARKETING_VERSION 1.2.3); the build number is
      # the workflow run number, which is unique and strictly increasing
      # across runs -- App Store Connect rejects re-uploading a build
      # number it's already seen for the same version, so this can't
      # just stay hardcoded at "1" the way project.yml's default is for
      # local/simulator builds.
      - name: Derive version and build number
        run: |
          echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Archive (automatic signing via App Store Connect API key)
        run: |
          xcodebuild archive \
            -project Aipicam.xcodeproj -scheme Aipicam \
            -destination 'generic/platform=iOS' \
            -archivePath build/aipicam.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPSTORE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export a signed .ipa for App Store Connect
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPSTORE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/aipicam.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/export/aipicam.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
