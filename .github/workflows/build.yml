name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# This account's default GITHUB_TOKEN workflow permission is read-only,
# so the release step below would otherwise fail with "Resource not
# accessible by integration" on every tag push.
permissions:
  contents: write

jobs:
  build:
    # Needs a real Xcode toolchain (SwiftUI headers, the iOS SDK) --
    # unlike the Alpine daemons in this project family, there's no Docker
    # shortcut for that, so this runs on GitHub's hosted macOS runner,
    # same as pi-bluetooth-configuration-client-mac's build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint Info.plist
        run: plutil -lint Sources/Aipicam/Info.plist

      - name: Build for iOS Simulator
        # Compile check against the Simulator SDK first, cheaper and
        # faster to fail on than a full device archive below. The
        # Simulator shares the runner's own network rather than joining a
        # Pi's fallback AP, so this only ever verifies the app builds,
        # not that it talks to a real Pi.
        run: |
          xcodebuild -project Aipicam.xcodeproj -scheme Aipicam \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive for a real device (unsigned)
        # This repo has no paid Apple Developer Program enrollment, so
        # there's no real signing identity/provisioning profile for CI to
        # sign with -- CODE_SIGN_IDENTITY="" + CODE_SIGNING_ALLOWED=NO
        # skip that requirement, and AD_HOC_CODE_SIGNING_ALLOWED=YES asks
        # the build system to apply its own throwaway ad hoc signature
        # instead of failing outright. The result runs on a real
        # arm64 device's CPU but isn't signed with anything Apple (or
        # any device) will actually trust yet -- see the README for how
        # to resign it yourself before installing.
        run: |
          xcodebuild archive -project Aipicam.xcodeproj -scheme Aipicam \
            -destination 'generic/platform=iOS' \
            -archivePath build/aipicam.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        # An .ipa is nothing more than a .zip with the .app inside a
        # top-level "Payload/" directory -- xcodebuild's own
        # -exportArchive step insists on a real signing identity/export
        # method, which this repo doesn't have, so this assembles the
        # .ipa by hand instead. `ditto` (not plain zip) preserves the
        # bundle's extended attributes and ad hoc signature correctly.
        run: |
          set -e
          APP=build/aipicam.xcarchive/Products/Applications/aipicam.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload aipicam-unsigned.ipa
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: aipicam-unsigned-ipa
          path: aipicam-unsigned.ipa

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aipicam-unsigned.ipa
